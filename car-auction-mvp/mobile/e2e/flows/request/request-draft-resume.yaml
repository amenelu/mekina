appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    stopApp: true
- openLink: mobile://request/upload
- tapOn:
    id: "request-upload-notes-input"
- inputText: "Need sunroof and leather seats"
- openLink: mobile://request
- assertVisible: "Continue your saved request"
- tapOn:
    id: "saved-request-continue"
- assertVisible: "Need sunroof and leather seats"
